name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        # labeled: release-please opens its PR as the bot, so these runs are held
        # at action_required; its trigger-ci label (applied with
        # RELEASE_PLEASE_TOKEN) re-fires CodeQL, a required check, the same way
        # it re-fires ci.yml.
        types: [opened, synchronize, reopened, labeled]
    schedule:
        - cron: '30 1 * * 1'

permissions: read-all

jobs:
    analyze:
        name: Analyze (javascript-typescript)
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Initialize CodeQL
              # github/codeql-action v3.28.13
              uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
              with:
                  languages: javascript-typescript
                  queries: security-extended

            - name: Analyze
              # github/codeql-action v3.28.13
              uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
              with:
                  category: /language:javascript-typescript
