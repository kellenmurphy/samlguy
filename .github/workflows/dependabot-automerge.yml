name: Dependabot Auto-merge

on: pull_request

permissions:
    contents: read

jobs:
    automerge:
        name: Enable auto-merge
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'kellenmurphy/samlguy'
        runs-on: ubuntu-latest
        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              # dependabot/fetch-metadata v3.1.0
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
              with:
                  github-token: '${{ secrets.GITHUB_TOKEN }}'

            # Auto-merge is enabled with a fine-grained PAT (Dependabot secret),
            # not GITHUB_TOKEN: merges made by GITHUB_TOKEN do not trigger the
            # push workflows that run the Cloudflare Pages deploy and
            # release-please. Major version bumps are left for manual review.
            - name: Enable auto-merge for patch/minor updates
              if: >-
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor'
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
